<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a10">
<title>综合排名榜 · 综合考核工作台</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="appbar">
  <div class="appbar__eyebrow">MONTHLY RANKING</div>
  <div class="appbar__row">
    <div>
      <h1 class="appbar__title">综合排名榜</h1>
      <div class="appbar__sub" id="sub">加载中…</div>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="切换主题"></button>
  </div>
</header>

<main class="screen" id="app"></main>

<nav id="tabbar"></nav>

<script src="assets/ui.js"></script>
<script>
UI.tabbar('rank');

fetch('data/rank.json', { cache: 'no-cache' })
  .then(function (r) { if (!r.ok) throw new Error('no file'); return r.json(); })
  .then(render)
  .catch(function () {
    document.getElementById('sub').textContent = '暂无数据';
    document.getElementById('app').innerHTML =
      '<div class="card" style="margin-top:16px"><div class="sect__head"><span class="sect__title">还没有发布排名</span></div>' +
      '<div class="hint">排名数据由计划经营科每月核算后导出，文件为 <b>data/rank.json</b>。' +
      '科室运行汇总脚本后自动更新，页面刷新即可看到。</div></div>';
  });

function n(v) { return (v == null || v === '') ? '—' : Number(v).toFixed(2); }

function render(d) {
  document.getElementById('sub').textContent = (d.month || '本期') + ' · 更新于 ' + (d.updatedAt || '—');

  var rows = (d.stations || []).slice().sort(function (a, b) { return b.total - a.total; });
  if (!rows.length) {
    document.getElementById('app').innerHTML =
      '<div class="card" style="margin-top:16px"><div class="hint">本月尚无已核算的站点。</div></div>';
    return;
  }

  var h = '';

  if (rows.length >= 3) {
    h += '<div class="sect__head" style="margin-top:18px"><span class="sect__title">前三名</span>' +
      '<span class="sect__hint">发榜 · 评优优先</span></div>';
    h += '<div class="podium">';
    var order = [1, 0, 2];
    order.forEach(function (i) {
      var s = rows[i];
      if (!s) return;
      h += '<div class="podium__item' + (i === 0 ? ' first' : '') + '">';
      h += '<div class="podium__rank">NO.' + (i + 1) + '</div>';
      h += '<div class="podium__name">' + UI.esc(s.name) + '</div>';
      h += '<div class="podium__score">' + n(s.total) + '</div>';
      h += '</div>';
    });
    h += '</div>';
  }

  h += '<div class="sect__head" style="margin-top:22px"><span class="sect__title">全部排名</span>' +
    '<span class="sect__hint">' + rows.length + ' 站</span></div>';
  h += '<section class="card card--flush" style="padding:12px 14px 4px"><table class="tbl"><thead><tr>' +
    '<th style="width:30px">#</th><th>油站</th><th class="num">油品</th><th class="num">非油</th><th class="num">人效</th>' +
    '<th class="num">管理</th><th class="num">综合</th>' +
    '</tr></thead><tbody>';

  rows.forEach(function (s, i) {
    h += '<tr>';
    h += '<td class="rk">' + (i + 1) + '</td>';
    h += '<td><b>' + UI.esc(s.name) + '</b>' + (s.vetoed ? ' <span class="tag no">否决</span>' : '') + '</td>';
    h += '<td class="num">' + n(s.oilScore) + '</td>';
    h += '<td class="num">' + n(s.nonoilScore) + '</td>';
    h += '<td class="num">' + n(s.effScore) + '</td>';
    h += '<td class="num">' + n(s.inspectScore) + '</td>';
    h += '<td class="num"><b>' + n(s.total) + '</b></td>';
    h += '</tr>';
  });

  h += '</tbody></table></section>';
  h += '<p class="sect__note" style="margin-top:12px">综合得分 ＝ 人效段 ＋ 非油段 ＋ 检查段 − 投诉扣分 ＋ 进步加分。' +
    '触发一票否决的站当期记 0 分并置末位。</p>';

  document.getElementById('app').innerHTML = h;
}
</script>
</body>
</html>
