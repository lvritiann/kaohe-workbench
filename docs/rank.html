<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>综合排名榜 · 综合考核工作台</title>
<link rel="stylesheet" href="assets/app.css">
<meta name="theme-color" content="#1f4e5f">
</head>
<body>

<div class="topbar">
  <div class="row">
    <div>
      <h1>综合排名榜</h1>
      <div class="sub" id="sub">加载中…</div>
    </div>
    <a class="back" href="index.html">返回</a>
  </div>
</div>

<div class="wrap" id="app"></div>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

fetch('data/rank.json', { cache: 'no-cache' })
  .then(function (r) { if (!r.ok) throw new Error('no file'); return r.json(); })
  .then(render)
  .catch(function () {
    document.getElementById('sub').textContent = '暂无数据';
    document.getElementById('app').innerHTML =
      '<div class="card"><h2>还没有发布排名</h2>' +
      '<div class="hint">排名数据由计划经营科每月核算后导出，文件是 <b>data/rank.json</b>。' +
      '在科室运行汇总脚本后自动更新，页面刷新即可看到。</div></div>';
  });

function render(d) {
  document.getElementById('sub').textContent = (d.month || '') + ' · 更新于 ' + (d.updatedAt || '');

  var rows = (d.stations || []).slice().sort(function (a, b) { return b.total - a.total; });
  if (!rows.length) {
    document.getElementById('app').innerHTML = '<div class="card"><div class="hint">本月尚无已核算的站点。</div></div>';
    return;
  }

  var h = '<div class="card" style="padding:12px 14px"><h2 style="margin:0 0 6px">综合得分</h2>' +
    '<div class="hint">基线 100 分，非油封顶时理论满分 120。同一得分下人效段高者排前。</div></div>';

  h += '<div class="card"><table class="tbl"><thead><tr>' +
    '<th style="width:34px">#</th><th>油站</th><th class="num">人效段</th><th class="num">非油段</th>' +
    '<th class="num">检查段</th><th class="num">综合</th><th style="width:56px">等级</th>' +
    '</tr></thead><tbody>';

  rows.forEach(function (s, i) {
    var tag = s.grade === '优秀' ? 'ok' : s.grade === '不合格' ? 'no' : '';
    h += '<tr>';
    h += '<td>' + (i + 1) + '</td>';
    h += '<td>' + esc(s.name) + (s.vetoed ? ' <span class="tag no">否决</span>' : '') + '</td>';
    h += '<td class="num">' + n(s.effSeg) + '</td>';
    h += '<td class="num">' + n(s.nonoilSeg) + '</td>';
    h += '<td class="num">' + n(s.inspSeg) + '</td>';
    h += '<td class="num"><b>' + n(s.total) + '</b></td>';
    h += '<td><span class="tag ' + tag + '">' + esc(s.grade || '') + '</span></td>';
    h += '</tr>';
  });

  h += '</tbody></table>';
  h += '<div class="hint" style="margin-top:10px">综合得分 ＝ 人效段 ＋ 非油段 ＋ 检查段 − 投诉扣分 ＋ 进步加分。' +
    '触发一票否决的站当期记 0 分并置末位。</div></div>';

  document.getElementById('app').innerHTML = h;
}

function n(v) { return (v == null || v === '') ? '—' : Number(v).toFixed(2); }
</script>
</body>
</html>
