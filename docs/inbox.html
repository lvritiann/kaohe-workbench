<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a10">
<title>待交箱 · 综合考核工作台</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="appbar appbar--compact">
  <div class="appbar__row">
    <div>
      <h1 class="appbar__title">待交箱</h1>
      <div class="appbar__sub">已生成、可能还没发回科室的检查表</div>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="切换主题"></button>
    <a class="appbar__action" href="index.html">返回</a>
  </div>
</header>

<main class="screen" id="app">
  <div class="card" style="margin-top:16px"><div class="hint">读取中…</div></div>
</main>

<nav id="tabbar"></nav>

<script src="assets/ui.js"></script>
<script src="assets/store.js"></script>
<script>
UI.tabbar('');

function dt(t) {
  var d = new Date(t);
  function p(x) { return ('0' + x).slice(-2); }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

Store.listOutbox().then(function (list) {
  list.sort(function (a, b) { return b.submittedAt - a.submittedAt; });
  var app = document.getElementById('app');
  if (!list.length) {
    app.innerHTML = '<div class="card" style="margin-top:16px">' +
      '<div class="sect__head"><span class="sect__title">没有待交记录</span></div>' +
      '<div class="hint">打完分并提交后，生成的检查表会登记在这里。发回计划经营科并确认导入后，可在此标记已交。</div></div>';
    return;
  }

  var h = '<div class="sect__head" style="margin-top:18px"><span class="sect__title">共 ' + list.length + ' 条</span>' +
    '<span class="sect__hint">按提交时间倒序</span></div>';
  list.forEach(function (r) {
    h += '<section class="card">';
    h += '<div class="kv"><span>油站 / 月份</span><b>' + UI.esc(r.station) + ' · ' + UI.esc(r.month) + '</b></div>';
    h += '<div class="kv"><span>检查人</span><b>' + UI.esc(r.inspector || '—') + '</b></div>';
    h += '<div class="kv"><span>折算得分</span><b>' + (r.converted || 0).toFixed(2) + '（' + UI.esc(r.grade || '') + '）</b></div>';
    h += '<div class="kv"><span>提交时间</span><b>' + dt(r.submittedAt) + '</b></div>';
    if (r.vetoed) h += '<div class="warn">该次检查已触发一票否决。</div>';
    h += '<p class="hint" style="margin-top:10px;word-break:break-all">' + UI.esc(r.fileName || '') + '</p>';
    h += '<button class="btn btn--ghost btn--block" style="margin-top:12px" data-del="' + UI.esc(r.id) + '">标记为已交</button>';
    h += '</section>';
  });
  app.innerHTML = h;

  app.addEventListener('click', function (e) {
    var id = e.target.getAttribute && e.target.getAttribute('data-del');
    if (!id) return;
    Store.removeOutbox(id).then(function () { location.reload(); });
  });
}).catch(function () {
  document.getElementById('app').innerHTML = '<div class="err">本机存储不可用（可能是浏览器隐私模式）。</div>';
});
</script>
</body>
</html>
