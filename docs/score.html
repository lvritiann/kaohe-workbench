<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d53">
<title>现场检查打分 · 综合考核工作台</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="appbar appbar--compact">
  <div class="appbar__row">
    <div style="min-width:0">
      <h1 class="appbar__title">现场检查打分</h1>
      <div class="appbar__sub" id="subInfo">加载中…</div>
    </div>
    <a class="appbar__action" href="index.html">关闭</a>
  </div>
</header>

<main class="screen screen--focus" id="app"></main>

<div class="actionbar">
  <div class="actionbar__inner">
    <div class="actionbar__stat">
      <div class="actionbar__num"><span id="barScore">—</span><small>分</small></div>
      <div class="actionbar__sub" id="barSub">已判 0 / 73 项</div>
    </div>
    <button class="btn btn--primary" id="btnSubmit">提交</button>
  </div>
</div>

<div class="mask" id="mask"><div class="sheet" id="modal"></div></div>

<script src="assets/config.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/score.js"></script>
</body>
</html>
