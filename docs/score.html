<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a10">
<title>现场检查打分 · 目标责任考核 V1.0</title>
<link rel="stylesheet" href="assets/app.css">
<style>
.login-wrap{max-width:420px;margin:60px auto 0}
.login-logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:rgba(47,224,200,.1);border:1px solid rgba(47,224,200,.25);color:#2fe0c8;font-size:24px;margin:0 auto 18px}
.deduct{margin-top:10px;padding:12px;border:1px solid rgba(255,107,94,.32);border-radius:var(--r-md);background:rgba(255,107,94,.06);animation:slideDown .2s var(--ease)}
.thumb{width:58px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.photo-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.item-state{font:11px/1 ui-monospace,Consolas,monospace;padding:3px 8px;border-radius:999px;border:1px solid rgba(53,211,154,.35);color:var(--ok);background:rgba(53,211,154,.08)}
.item-state.no{color:var(--no);border-color:rgba(255,107,94,.35);background:rgba(255,107,94,.08)}
.veto-line{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mini-btn{padding:5px 10px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;color:var(--text-2);font-size:12px;cursor:pointer;min-height:32px}
.mini-btn.on{background:var(--no);border-color:var(--no);color:#fff}
/* 拍照 / 相册两个入口。透明 input 铺满 label，点哪儿都等于点 input 本身
   （不依赖 label[for] 转发，部分 X5 内核转发会失效）。 */
.photo-pick{display:flex;gap:8px;margin-top:2px}
.photo-cap{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:7px 16px;border:1px solid var(--line-strong,rgba(140,170,190,.45));border-radius:8px;color:var(--text-2);font-size:13px;cursor:pointer;min-height:36px;overflow:hidden;-webkit-tap-highlight-color:transparent}
.photo-cap:active{background:rgba(255,255,255,.06)}
.photo-cap input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;font-size:0;cursor:pointer}
/* 「拍照」现在是 <button>（原生相机），要把浏览器默认的按钮样式清掉才和 label 长得一样 */
button.photo-cap{background:transparent;font-family:inherit;line-height:normal}
/* 原生相机取景。
   ★ 为什么不用 <input capture>：三星浏览器、部分国产内核直接忽略 capture 属性，
     落到系统相册，而相册里没有拍照入口 —— 现场等于拍不了照。
     getUserMedia 不开 Intent，直接开摄像头，各家内核都认；代价是首次要授权一次。 */
.cammask{position:fixed;inset:0;z-index:9999;background:#000;display:none}
.cammask.on{display:block}
.cammask video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.cam-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 14px 14px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0))}
.cam-btn{padding:8px 15px;border:1px solid rgba(255,255,255,.35);border-radius:999px;background:rgba(0,0,0,.35);color:#fff;font-size:13px;cursor:pointer;min-height:36px;font-family:inherit}
.cam-btn:active{background:rgba(255,255,255,.2)}
.cam-tip{position:absolute;left:0;right:0;bottom:calc(112px + env(safe-area-inset-bottom));text-align:center;color:rgba(255,255,255,.72);font-size:12px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.cam-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:0 0 calc(26px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.65))}
.cam-shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.45);box-shadow:inset 0 0 0 3px rgba(0,0,0,.35);cursor:pointer;-webkit-tap-highlight-color:transparent}
.cam-shutter:active{transform:scale(.94)}
</style>
</head>
<body>

<header class="appbar appbar--compact">
  <div class="appbar__row">
    <div style="min-width:0">
      <h1 class="appbar__title">现场检查打分</h1>
      <div class="appbar__sub" id="subInfo">四项制 V1.0 · 登录中…</div>
    </div>
    <a class="appbar__action" href="index.html">退出</a>
  </div>
</header>

<main class="screen screen--focus" id="app"></main>

<div class="actionbar" id="actionbar" style="display:none">
  <div class="actionbar__inner">
    <div class="actionbar__stat">
      <div class="actionbar__num"><span id="barScore">100</span><small>折算分 / 100</small></div>
      <div class="actionbar__sub" id="barSub">已扣 0 项</div>
    </div>
    <button class="btn btn--primary" id="btnSubmit">提交</button>
  </div>
</div>

<div class="mask" id="mask"><div class="sheet" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="assets/ui.js"></script>
<script src="assets/config.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/store.js"></script>
<!-- Excel / Zip 组件共约 1MB：改为登录后按需加载，登录页不再等待 -->
<script src="assets/score.js"></script>
</body>
</html>
