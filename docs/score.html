<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a10">
<title>现场检查打分 · 目标责任考核 V1.0</title>
<link rel="stylesheet" href="assets/app.css">
<style>
.login-wrap{max-width:420px;margin:60px auto 0}
.login-logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:rgba(47,224,200,.1);border:1px solid rgba(47,224,200,.25);color:#2fe0c8;font-size:24px;margin:0 auto 18px}
.deduct{margin-top:10px;padding:12px;border:1px solid rgba(255,107,94,.32);border-radius:var(--r-md);background:rgba(255,107,94,.06);animation:slideDown .2s var(--ease)}
.thumb{width:58px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.photo-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.item-state{font:11px/1 ui-monospace,Consolas,monospace;padding:3px 8px;border-radius:999px;border:1px solid rgba(53,211,154,.35);color:var(--ok);background:rgba(53,211,154,.08)}
.item-state.no{color:var(--no);border-color:rgba(255,107,94,.35);background:rgba(255,107,94,.08)}
.veto-line{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mini-btn{padding:5px 10px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;color:var(--text-2);font-size:12px;cursor:pointer;min-height:32px}
.mini-btn.on{background:var(--no);border-color:var(--no);color:#fff}
</style>
</head>
<body>

<header class="appbar appbar--compact">
  <div class="appbar__row">
    <div style="min-width:0">
      <h1 class="appbar__title">现场检查打分</h1>
      <div class="appbar__sub" id="subInfo">五段制 V1.0 · 登录中…</div>
    </div>
    <a class="appbar__action" href="index.html">退出</a>
  </div>
</header>

<main class="screen screen--focus" id="app"></main>

<div class="actionbar" id="actionbar" style="display:none">
  <div class="actionbar__inner">
    <div class="actionbar__stat">
      <div class="actionbar__num"><span id="barScore">100</span><small>折算分 / 100</small></div>
      <div class="actionbar__sub" id="barSub">已扣 0 项</div>
    </div>
    <button class="btn btn--primary" id="btnSubmit">提交</button>
  </div>
</div>

<div class="mask" id="mask"><div class="sheet" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="assets/ui.js"></script>
<script src="assets/config.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/store.js"></script>
<!-- Excel / Zip 组件共约 1MB：改为登录后按需加载，登录页不再等待 -->
<script src="assets/score.js"></script>
</body>
</html>
